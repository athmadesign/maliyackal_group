{% extends "core/base.html" %}

{% load static %}

{% block title %}Home{% endblock title %}

{% block content %}


    <div class="page-wrapper">
        

        <!--Page Header Start-->
        <section class="page-header">
            <div class="page-header__bg" style="background-image: url({% static 'images/backgrounds/page-header-bg.jpg' %});">
            </div>
            <div class="container">
                <div class="page-header__inner">
                    <div class="page-header__title-box">
                        <p>Business Models you can Consider</p>
                        <h3>Error Page</h3>
                    </div>
                    <div class="thm-breadcrumb__box">
                        <ul class="thm-breadcrumb list-unstyled">
                            <li><a href="index.html">Home</a></li>
                            <li><span>/</span></li>
                            <li>Error Page</li>
                        </ul>
                    </div>
                </div>
            </div>
        </section>
        <!--Page Header End-->

        <!--Error Page Start-->
        <section class="error-page">
            <div class="section-shape-1" style="background-image: url({% static 'images/shapes/section-shape-1.png' %});"></div>
            <div class="container">
                <div class="error-page__inner">
                    <div class="error-page__img">
                        <img src="{% static 'images/resources/error-page-img-1.png' %}" alt="">
                    </div>
                    <div class="error-page__btn-box">
                        <a href="index.html" class="thm-btn error-page__btn">Back To Home <span
                                class="icon-up-right-arrow"></span> </a>
                    </div>
                </div>
            </div>
        </section>
        <!--Error Page End-->

        


    </div><!-- /.page-wrapper -->


{% endblock content %}
